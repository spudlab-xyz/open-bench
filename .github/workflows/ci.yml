name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: openbench-ci-${{ github.run_id }}-${{ github.run_attempt }}
      MYSQL_DATABASE: openbench_ci
      MYSQL_USER: openbench_ci
      MYSQL_PASSWORD: ci-application-password-${{ github.run_id }}
      MYSQL_ROOT_PASSWORD: ci-root-password-${{ github.run_id }}
      OPENBENCH_PORT: 18080

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Verify backend
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build container stack
        run: docker compose build

      - name: Start and wait for healthy stack
        run: docker compose up --detach --wait --wait-timeout 180

      - name: Verify frontend and proxied health
        run: |
          curl --fail --silent --show-error http://127.0.0.1:18080/ > /dev/null
          health="$(curl --fail --silent --show-error http://127.0.0.1:18080/api/health)"
          test "$(jq --raw-output '.status' <<<"$health")" = "UP"

      - name: Print diagnostics on failure
        if: failure()
        run: |
          docker compose ps --all || true
          docker compose logs --no-color || true

      - name: Clean up containers and temporary data
        if: always()
        run: docker compose down --volumes --remove-orphans
