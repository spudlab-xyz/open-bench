services:
  mysql:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required and must not be empty}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required and must not be empty}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required and must not be empty}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required and must not be empty}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysql --protocol=TCP --host=127.0.0.1
          --user="$${MYSQL_USER}" --password="$${MYSQL_PASSWORD}"
          "$${MYSQL_DATABASE}" --execute='SELECT 1' --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - internal

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:?MYSQL_DATABASE is required and must not be empty}
      DB_USER: ${MYSQL_USER:?MYSQL_USER is required and must not be empty}
      DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required and must not be empty}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080;
          printf 'GET /actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          grep -q '"status":"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OPENBENCH_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:8080/]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  mysql-data:
